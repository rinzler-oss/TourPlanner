<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripPlanner - Plan Your Journey</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="logo">TripPlanner</h1>
    <p class="subtitle">Plan your journey, choose your ride</p>
  </header>

  <main class="container">
    <!-- Trip Input Form -->
    <section id="trip-form">
      <div class="form-card">
        <div class="form-row">
          <div class="form-group">
            <label for="origin">Origin</label>
            <input type="text" id="origin" placeholder="e.g., New York" autocomplete="off">
            <ul class="suggestions-list" id="origin-suggestions"></ul>
          </div>
          <button type="button" class="swap-btn" id="swap-btn" title="Swap origin and destination">&#8644;</button>
          <div class="form-group">
            <label for="destination">Destination</label>
            <input type="text" id="destination" placeholder="e.g., Boston" autocomplete="off">
            <ul class="suggestions-list" id="destination-suggestions"></ul>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="travel-date">Date of Travel</label>
            <input type="date" id="travel-date">
          </div>
        </div>
        <div class="form-group">
          <label>Select Vehicle Type</label>
          <div class="vehicle-selector" id="vehicle-selector">
            <button type="button" class="vehicle-option" data-vehicle="car">
              <span class="vehicle-icon">&#128663;</span> Car
            </button>
            <button type="button" class="vehicle-option" data-vehicle="bike">
              <span class="vehicle-icon">&#127949;</span> Bike
            </button>
            <button type="button" class="vehicle-option" data-vehicle="bicycle">
              <span class="vehicle-icon">&#128690;</span> Bicycle
            </button>
            <button type="button" class="vehicle-option" data-vehicle="walking">
              <span class="vehicle-icon">&#128694;</span> Walking
            </button>
            <button type="button" class="vehicle-option" data-vehicle="public">
              <span class="vehicle-icon">&#128652;</span> Public Transport
            </button>
          </div>
        </div>
        <!-- Vehicle Details (shown for Car/Bike) -->
        <div id="vehicle-details" class="vehicle-details hidden">
          <div class="vd-title">Your Vehicle Details</div>
          <div class="form-row">
            <div class="form-group">
              <label for="vd-brand">Brand</label>
              <select id="vd-brand"><option value="">Select Brand</option></select>
            </div>
            <div class="form-group">
              <label for="vd-model">Model</label>
              <select id="vd-model" disabled><option value="">Select Model</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="vd-fuel">Fuel Type</label>
              <select id="vd-fuel" disabled><option value="">Select Fuel Type</option></select>
            </div>
            <div class="form-group">
              <label>Mileage</label>
              <div class="mileage-display" id="vd-mileage">--</div>
            </div>
          </div>
        </div>

        <div id="form-error" class="form-error hidden"></div>
        <button type="button" class="btn-plan" id="plan-btn">Plan My Trip</button>
      </div>
    </section>

    <!-- Loading Indicator -->
    <section id="loading" class="hidden">
      <div class="loader">
        <div class="spinner"></div>
        <p>Planning your trip...</p>
      </div>
    </section>

    <!-- Map Display -->
    <section id="map-section" class="hidden">
      <div id="map-container">
        <div id="map"></div>
      </div>
    </section>

    <!-- Route Summary (own vehicles) -->
    <section id="route-summary" class="hidden">
      <h2 class="section-title">Route Summary</h2>
      <div class="summary-cards" id="summary-cards"></div>
      <div id="route-tips" class="route-tips"></div>
    </section>

    <!-- Public Transport Suggestions -->
    <section id="public-transport" class="hidden">
      <h2 class="section-title">Public Transport Options</h2>
      <div class="route-overview" id="route-overview"></div>
      <div class="transport-cards" id="transport-cards"></div>
    </section>
  </main>

  <footer>
    <p>TripPlanner &copy; 2026. Plan smart, travel safe.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
